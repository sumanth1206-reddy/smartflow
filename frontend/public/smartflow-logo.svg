<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="960" height="140">
  <defs>
    <linearGradient id="sfLogoCubeFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="sfLogoCubeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <linearGradient id="sfLogoPulseLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="sfLogoFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--logo-fill, #ffffff)" />
      <stop offset="100%" stop-color="var(--logo-fill-soft, #f8fafc)" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- ICON MARK (x=0 to 110) -->
    <g transform="translate(0, 10) scale(0.95)">
      <polygon points="50,8 88,28 50,48 12,28" fill="url(#sfLogoCubeFront)" />
      <polygon points="12,28 50,48 50,92 12,72" fill="url(#sfLogoPulseLine)" opacity="0.95" />
      <polygon points="50,48 88,28 88,72 50,92" fill="url(#sfLogoCubeSide)" />
      <path
        d="M 10 68 C 10 32, 50 12, 90 32 C 102 42, 96 74, 76 80 C 48 88, 14 74, 24 98 C 32 112, 70 114, 90 92"
        fill="none"
        stroke="url(#sfLogoPulseLine)"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="50" cy="48" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
    </g>

    <!-- CUSTOM GEOMETRIC WORDMARK "SMARTFLOW" (x=125) -->
    <g transform="translate(125, 0)">
      <!-- LETTER S (x=0) -->
      <g transform="translate(0, 0)">
        <path
          d="M 65 15 C 35 -5, -5 5, -5 35 C -5 60, 25 65, 50 75 C 75 85, 75 115, 40 125 C 5 135, -15 115, -15 95 L 5 90 C 5 105, 20 112, 40 108 C 55 104, 55 90, 35 82 C 10 72, -20 68, -20 35 C -20 -5, 25 -15, 65 0 Z"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
        <path
          d="M 65 15 C 35 -5, -5 5, -5 35 C -5 60, 25 65, 50 75 C 75 85, 75 115, 40 125 C 5 135, -15 115, -15 95"
          fill="none"
          stroke="url(#sfLogoPulseLine)"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"
          opacity="0.85"
        />
      </g>

      <!-- LETTER M (x=95) -->
      <g transform="translate(95, 0)">
        <path
          d="M 0 120 L 0 0 L 25 0 L 45 75 L 65 0 L 90 0 L 90 120 L 72 120 L 72 35 L 54 110 L 36 110 L 18 35 L 18 120 Z"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </g>

      <!-- LETTER A (x=198) -->
      <g transform="translate(198, 0)">
        <path
          d="M 45 0 L 5 120 L 25 120 L 37 85 L 53 85 L 65 120 L 85 120 Z M 45 25 L 40 70 L 50 70 Z"
          fill-rule="evenodd"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </g>

      <!-- LETTER R (x=295) -->
      <g transform="translate(295, 0)">
        <path
          d="M 0 120 L 0 0 L 40 0 C 70 0, 70 55, 40 55 L 65 120 L 42 120 L 20 60 L 20 120 Z M 20 20 L 20 42 L 38 42 C 52 42, 52 20, 38 20 Z"
          fill-rule="evenodd"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </g>

      <!-- LETTER T (x=382) -->
      <g transform="translate(382, 0)">
        <path
          d="M 0 0 L 80 0 L 80 20 L 50 20 L 50 120 L 30 120 L 30 20 L 0 20 Z"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </g>

      <!-- LETTER F (x=475) -->
      <g transform="translate(475, 0)">
        <path
          d="M 0 120 L 0 0 L 65 0 L 65 20 L 20 20 L 20 50 L 55 50 L 55 70 L 20 70 L 20 120 Z"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </g>

      <!-- LETTER L (x=552) -->
      <g transform="translate(552, 0)">
        <path
          d="M 0 0 L 20 0 L 20 100 L 60 100 L 60 120 L 0 120 Z"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </g>

      <!-- LETTER O (x=625) with Subtle #2563EB Blue Accent Edge Glow -->
      <g transform="translate(625, 0)">
        <path
          d="M 40 0 C 65 0, 80 20, 80 60 C 80 100, 65 120, 40 120 C 15 120, 0 100, 0 60 C 0 20, 15 0, 40 0 Z M 40 22 C 26 22, 20 38, 20 60 C 20 82, 26 98, 40 98 C 54 98, 60 82, 60 60 C 60 38, 54 22, 40 22 Z"
          fill-rule="evenodd"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
        <circle cx="40" cy="60" r="16" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.9" />
      </g>

      <!-- LETTER W (x=718) -->
      <g transform="translate(718, 0)">
        <path
          d="M 0 0 L 18 120 L 36 120 L 50 45 L 64 120 L 82 120 L 100 0 L 82 0 L 72 85 L 57 15 L 43 15 L 28 85 L 18 0 Z"
          fill="url(#sfLogoFaceGrad)"
          stroke="var(--logo-stroke, #0F172A)"
          stroke-width="5"
          stroke-linejoin="round"
        />
        <path
          d="M 100 0 L 82 0 L 72 85 L 57 15"
          fill="none"
          stroke="url(#sfLogoPulseLine)"
          stroke-width="2.5"
          stroke-linejoin="round"
          opacity="0.85"
        />
      </g>
    </g>
  </g>
</svg>
